<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login realizado</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef5e8;
            font-family: Arial, sans-serif;
        }

        .caixa {
            width: 400px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .icone {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #31572c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        h1 {
            color: #31572c;
            margin-bottom: 12px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .dados {
            background: #f5f7f3;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: left;
        }

        .dados strong {
            color: #31572c;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: #31572c;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        a:hover {
            background: #3f6d38;
        }
    </style>
</head>

<body>

    <div class="caixa">

        <div class="icone">
            ✓
        </div>

        <h1>Login realizado!</h1>

        <p>
            Se você está vendo esta tela, significa que
            o usuário foi encontrado no banco de dados.
        </p>

        <div class="dados">
            <p>
                <strong>Usuário:</strong> Cesar
            </p>

            <p>
                <strong>E-mail:</strong> cesar@gmail.com
            </p>

            <p>
                <strong>Perfil:</strong> Produtor
            </p>
        </div>

        <a href="login-marketplace.html">
            Voltar para o login
        </a>

    </div>

</body>

</html>
