<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Bento, o cão fazendeiro mascote do MarketPlace Rural">
  <!-- Bento: Border Collie fazendeiro, mascote do onboarding.
       As classes mascote-* são animadas pelo onboarding.css -->
  <ellipse cx="100" cy="211" rx="54" ry="6" fill="#31572c" opacity=".16"/>

  <g class="mascote-corpo">

    <!-- rabo (abana) -->
    <g class="mascote-rabo">
      <path d="M132 186 Q160 188 166 162" fill="none" stroke="#2b2d33" stroke-width="14" stroke-linecap="round"/>
      <path d="M165.5 170 Q166 166 166 162" fill="none" stroke="#f7f3ea" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- botinas -->
    <path d="M60 206 Q60 196 70 196 L92 196 Q96 196 96 201 L96 206 Q96 210 92 210 L64 210 Q60 210 60 206 Z" fill="#6b3f1f"/>
    <path d="M104 201 Q104 196 108 196 L130 196 Q140 196 140 206 Q140 210 136 210 L108 210 Q104 210 104 206 Z" fill="#6b3f1f"/>
    <path d="M62 207 L94 207 M106 207 L138 207" stroke="#4a2a14" stroke-width="3" stroke-linecap="round"/>

    <!-- tronco e peito branco -->
    <path d="M64 152 C64 132 80 122 100 122 C120 122 136 132 136 152 L136 192 L64 192 Z" fill="#2b2d33"/>
    <ellipse cx="100" cy="140" rx="22" ry="17" fill="#f7f3ea"/>

    <!-- jardineira -->
    <path d="M71 134 L84 150 M129 134 L116 150" stroke="#3f6d9e" stroke-width="8" stroke-linecap="round"/>
    <path d="M80 151 Q80 146 85 146 L115 146 Q120 146 120 151 L121 168 Q137 170 139 182 L139 195 Q139 200 134 200 L104 200 L102 190 L98 190 L96 200 L66 200 Q61 200 61 195 L61 182 Q63 170 79 168 Z" fill="#4a78a8"/>
    <path d="M84 152 L116 152 L117 168 M66 186 L96 186 M104 186 L134 186" fill="none" stroke="#a9c4e0" stroke-width="1.4" stroke-dasharray="3 2.5" opacity=".8"/>
    <rect x="91" y="155" width="18" height="11" rx="2.5" fill="#3f6d9e"/>
    <path d="M93 158 L107 158" stroke="#a9c4e0" stroke-width="1.2" stroke-dasharray="2 2"/>
    <!-- remendo no joelho -->
    <g transform="rotate(-8 121 188)">
      <rect x="114" y="181" width="14" height="12" rx="2" fill="#c9a26b"/>
      <rect x="115.5" y="182.5" width="11" height="9" rx="1.5" fill="none" stroke="#8c6a3c" stroke-width="1" stroke-dasharray="2 1.6"/>
    </g>
    <circle cx="85" cy="150" r="3.4" fill="#e8b64c" stroke="#b5862c" stroke-width="1"/>
    <circle cx="115" cy="150" r="3.4" fill="#e8b64c" stroke="#b5862c" stroke-width="1"/>

    <!-- braço esquerdo parado -->
    <g class="braco-esquerdo">
      <path d="M70 136 Q60 152 62 170" fill="none" stroke="#2b2d33" stroke-width="13" stroke-linecap="round"/>
      <ellipse cx="62" cy="173" rx="8" ry="7" fill="#f7f3ea"/>
      <path d="M59 177 L59 179.5 M64 177 L64 179.5" stroke="#d8cfbd" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- braço direito parado (aparece no tour quando ele não está acenando) -->
    <g class="braco-direito" display="none">
      <path d="M130 136 Q140 152 138 170" fill="none" stroke="#2b2d33" stroke-width="13" stroke-linecap="round"/>
      <ellipse cx="138" cy="173" rx="8" ry="7" fill="#f7f3ea"/>
      <path d="M136 177 L136 179.5 M141 177 L141 179.5" stroke="#d8cfbd" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- bandana -->
    <path d="M70 119 Q100 131 130 119 L127 127 Q112 134 100 148 Q88 134 73 127 Z" fill="#c0392b"/>
    <g fill="#f7f3ea" opacity=".9">
      <circle cx="88" cy="131" r="1.6"/>
      <circle cx="100" cy="135" r="1.6"/>
      <circle cx="112" cy="131" r="1.6"/>
      <circle cx="94" cy="139" r="1.4"/>
      <circle cx="106" cy="139" r="1.4"/>
      <circle cx="100" cy="144" r="1.2"/>
    </g>
    <path d="M126 121 L136 117 L134 126 Z" fill="#a93226"/>

    <!-- cabeça (inclina de leve) -->
    <g class="mascote-cabeca">
      <path d="M100 40 C131 40 147 60 147 84 C147 108 127 125 100 125 C73 125 53 108 53 84 C53 60 69 40 100 40 Z" fill="#2b2d33"/>

      <!-- orelhas caídas -->
      <g class="mascote-orelhas">
        <path d="M62 62 C46 62 39 80 43 98 C45 107 54 108 58 99 C62 88 65 77 68 68 Z" fill="#23252a"/>
        <path d="M138 62 C154 62 161 80 157 98 C155 107 146 108 142 99 C138 88 135 77 132 68 Z" fill="#23252a"/>
      </g>

      <!-- máscara branca e focinho -->
      <path d="M100 56 C95 56 93 66 93 76 C84 84 73 92 73 103 C73 117 87 124 100 124 C113 124 127 117 127 103 C127 92 116 84 107 76 C107 66 105 56 100 56 Z" fill="#f7f3ea"/>

      <!-- sobrancelhas caramelo -->
      <ellipse cx="80" cy="71" rx="5.5" ry="3.2" fill="#c98a4b" transform="rotate(-12 80 71)"/>
      <ellipse cx="120" cy="71" rx="5.5" ry="3.2" fill="#c98a4b" transform="rotate(12 120 71)"/>

      <!-- olhos (piscam) -->
      <g class="mascote-olhos">
        <ellipse cx="81" cy="85" rx="8.5" ry="9.5" fill="#ffffff"/>
        <ellipse cx="119" cy="85" rx="8.5" ry="9.5" fill="#ffffff"/>
        <!-- pupilas (olham para onde ele aponta ou escreve) -->
        <g class="mascote-pupilas">
          <circle cx="82" cy="86.5" r="6.4" fill="#6b4220"/>
          <circle cx="118" cy="86.5" r="6.4" fill="#6b4220"/>
          <circle cx="82" cy="87" r="4" fill="#15161a"/>
          <circle cx="118" cy="87" r="4" fill="#15161a"/>
          <circle cx="84.5" cy="83.8" r="2.3" fill="#ffffff"/>
          <circle cx="120.5" cy="83.8" r="2.3" fill="#ffffff"/>
          <circle cx="80" cy="89.5" r="1" fill="#ffffff" opacity=".8"/>
          <circle cx="116" cy="89.5" r="1" fill="#ffffff" opacity=".8"/>
        </g>
      </g>

      <!-- bochechas -->
      <ellipse cx="80" cy="105" rx="6" ry="3.5" fill="#f2a1a1" opacity=".55"/>
      <ellipse cx="120" cy="105" rx="6" ry="3.5" fill="#f2a1a1" opacity=".55"/>

      <!-- nariz, boca e língua -->
      <path d="M91.5 96 Q100 91.5 108.5 96 Q107 103.5 100 104.5 Q93 103.5 91.5 96 Z" fill="#1c1d21"/>
      <ellipse cx="97" cy="95.8" rx="2.8" ry="1.3" fill="#ffffff" opacity=".6"/>
      <path d="M95.5 110.5 Q95 120 100 120 Q105 120 104.5 110.5 Q100 113 95.5 110.5 Z" fill="#e8707a"/>
      <path d="M100 112.5 L100 117" stroke="#c9505c" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M100 104.5 L100 108.5 M90 107.5 Q95 114 100 108.5 Q105 114 110 107.5" fill="none" stroke="#1c1d21" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- chapéu de palha -->
      <g class="mascote-chapeu">
        <ellipse cx="100" cy="54" rx="57" ry="11.5" fill="#efcb83"/>
        <path d="M45 56 Q100 72 155 56" fill="none" stroke="#c99a4a" stroke-width="2" stroke-linecap="round"/>
        <path d="M72 54 C71 32 84 22 100 22 C116 22 129 32 128 54 Q100 60 72 54 Z" fill="#e3b96a"/>
        <path d="M89 26 Q100 33 111 26" fill="none" stroke="#c99a4a" stroke-width="2" stroke-linecap="round"/>
        <path d="M72.5 44 Q100 49 127.5 44 L128 53 Q100 59 72 53 Z" fill="#4f772d"/>
        <g stroke="#c99a4a" stroke-width="1.3" stroke-linecap="round" opacity=".7">
          <path d="M80 40 L83 30 M92 41 L93 28 M108 41 L107 28 M120 40 L117 30"/>
          <path d="M52 55 L60 57 M66 60 L74 61 M126 61 L134 60 M140 57 L148 55"/>
        </g>
        <!-- raminho de trigo -->
        <path d="M120 49 Q127 36 136 26" fill="none" stroke="#b5862c" stroke-width="1.8" stroke-linecap="round"/>
        <g fill="#d9a441">
          <ellipse cx="136" cy="25" rx="2.2" ry="4" transform="rotate(40 136 25)"/>
          <ellipse cx="131" cy="30" rx="2" ry="3.6" transform="rotate(-20 131 30)"/>
          <ellipse cx="136" cy="32" rx="2" ry="3.6" transform="rotate(70 136 32)"/>
          <ellipse cx="127" cy="36" rx="2" ry="3.4" transform="rotate(-20 127 36)"/>
          <ellipse cx="132" cy="38" rx="2" ry="3.4" transform="rotate(70 132 38)"/>
        </g>
      </g>
    </g>

    <!-- braço que acena -->
    <g class="mascote-braco">
      <path d="M128 138 Q146 126 152 104" fill="none" stroke="#2b2d33" stroke-width="13" stroke-linecap="round"/>
      <ellipse cx="153" cy="100" rx="8.5" ry="8" fill="#f7f3ea"/>
      <path d="M149 94 L149.5 96.5 M154 93.2 L154 96 M158.5 94.5 L157.6 97" stroke="#d8cfbd" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- ===== POSES DO TOUR (escondidas por padrão; o onboarding.css mostra uma de cada vez) ===== -->

    <!-- apontando com o braço esquerdo (gira até o alvo pela variável --mira) -->
    <g class="apontar-esq" display="none">
      <g class="apontar-cutucar">
        <path d="M70 136 Q56 134 44 134" fill="none" stroke="#2b2d33" stroke-width="13" stroke-linecap="round"/>
        <path d="M33 133 L25 132" stroke="#d8cfbd" stroke-width="7" stroke-linecap="round"/>
        <path d="M33 133 L25 132" stroke="#f7f3ea" stroke-width="4.6" stroke-linecap="round"/>
        <ellipse cx="39" cy="134.5" rx="8" ry="7" fill="#f7f3ea"/>
        <path d="M37 139.5 L40 139.5" stroke="#d8cfbd" stroke-width="1.4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- apontando com o braço direito -->
    <g class="apontar-dir" display="none">
      <g class="apontar-cutucar">
        <path d="M130 136 Q144 134 156 134" fill="none" stroke="#2b2d33" stroke-width="13" stroke-linecap="round"/>
        <path d="M167 133 L175 132" stroke="#d8cfbd" stroke-width="7" stroke-linecap="round"/>
        <path d="M167 133 L175 132" stroke="#f7f3ea" stroke-width="4.6" stroke-linecap="round"/>
        <ellipse cx="161" cy="134.5" rx="8" ry="7" fill="#f7f3ea"/>
        <path d="M160 139.5 L163 139.5" stroke="#d8cfbd" stroke-width="1.4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- anotando na caderneta -->
    <g class="prop-caderneta" display="none">
      <path d="M70 136 Q62 154 78 164" fill="none" stroke="#2b2d33" stroke-width="13" stroke-linecap="round"/>
      <g transform="rotate(-8 92 156)">
        <rect x="76" y="138" width="32" height="37" rx="3" fill="#fffaf0" stroke="#c9b48a" stroke-width="1.2"/>
        <rect x="76" y="138" width="32" height="7" rx="2" fill="#c0392b"/>
        <g fill="none" stroke="#7a7f87" stroke-width="1.2">
          <circle cx="82" cy="138" r="1.8"/><circle cx="89" cy="138" r="1.8"/>
          <circle cx="96" cy="138" r="1.8"/><circle cx="103" cy="138" r="1.8"/>
        </g>
        <path d="M80 151 L104 151 M80 157 L104 157 M80 169 L104 169" stroke="#b9cde0" stroke-width="1"/>
        <path d="M80 151 q3 -3 6 0 t6 0 t5 0" fill="none" stroke="#4f772d" stroke-width="1.4" stroke-linecap="round"/>
        <path class="caderneta-escrita" d="M80 163 q3 -3 6 0 t6 0 t6 0" fill="none" stroke="#4f772d" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <ellipse cx="79" cy="166" rx="7.5" ry="6.5" fill="#f7f3ea"/>
      <path d="M130 136 Q130 152 114 157" fill="none" stroke="#2b2d33" stroke-width="13" stroke-linecap="round"/>
      <g class="caderneta-lapis">
        <path d="M115 147 L102 163" stroke="#e8b64c" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M115 147 L116.5 145" stroke="#e8a0a0" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M102.6 162.2 L100.6 165" stroke="#4a2a14" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="111" cy="156" rx="7.5" ry="6.5" fill="#f7f3ea"/>
      </g>
    </g>

    <!-- digitando no notebook -->
    <g class="prop-notebook" display="none">
      <path d="M70 136 Q64 156 80 167" fill="none" stroke="#2b2d33" stroke-width="13" stroke-linecap="round"/>
      <path d="M130 136 Q136 156 120 167" fill="none" stroke="#2b2d33" stroke-width="13" stroke-linecap="round"/>
      <rect x="71" y="141" width="58" height="35" rx="4" fill="#a7b0ba" stroke="#7d8792" stroke-width="1.5"/>
      <rect x="74" y="144" width="52" height="29" rx="2.5" fill="#b6bec7"/>
      <!-- broto no logo da tampa -->
      <path d="M100 165 L100 158" stroke="#31572c" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M100 159 C96 153 91 154 90 156 C93 160 97 160 100 159 Z" fill="#4f772d"/>
      <path d="M100 157 C104 151 109 152 110 154 C107 158 103 158 100 157 Z" fill="#90a955"/>
      <path d="M64 176 L136 176 L132 182 Q131 183 129 183 L71 183 Q69 183 68 182 Z" fill="#8a939d"/>
      <ellipse class="notebook-pata-esq" cx="80" cy="174" rx="7.5" ry="6.5" fill="#f7f3ea"/>
      <ellipse class="notebook-pata-dir" cx="120" cy="174" rx="7.5" ry="6.5" fill="#f7f3ea"/>
    </g>

    <!-- festejando: os dois braços pra cima -->
    <g class="braco-festa" display="none">
      <g class="festa-esq">
        <path d="M70 136 Q54 122 50 102" fill="none" stroke="#2b2d33" stroke-width="13" stroke-linecap="round"/>
        <ellipse cx="49" cy="97" rx="8.5" ry="8" fill="#f7f3ea"/>
      </g>
      <g class="festa-dir">
        <path d="M130 136 Q146 122 150 102" fill="none" stroke="#2b2d33" stroke-width="13" stroke-linecap="round"/>
        <ellipse cx="151" cy="97" rx="8.5" ry="8" fill="#f7f3ea"/>
      </g>
      <g class="festa-confete">
        <rect x="30" y="60" width="6" height="3.5" rx="1" fill="#e8b64c" transform="rotate(-25 33 62)"/>
        <circle cx="44" cy="38" r="2.6" fill="#c0392b"/>
        <rect x="160" y="54" width="6" height="3.5" rx="1" fill="#90a955" transform="rotate(30 163 56)"/>
        <circle cx="168" cy="80" r="2.4" fill="#4a78a8"/>
        <rect x="150" y="28" width="5" height="3.2" rx="1" fill="#c0392b" transform="rotate(-40 152 30)"/>
        <circle cx="26" cy="88" r="2.2" fill="#90a955"/>
      </g>
    </g>
  </g>
</svg>
