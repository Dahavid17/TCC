<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash Screen - MarketPlaceRural</title>
    <style>
        /* Reseta margens e configura a tela cheia */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* Fundo escuro com gradiente verde imitando um ambiente premium/tecnológico */
            background: radial-gradient(circle, #1a401a 0%, #051005 100%); 
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Animação estilo Xbox para a logo: Cresce, brilha e estabiliza */
        .logo {
            width: 150px;
            height: 150px;
            opacity: 0;
            transform: scale(0.5);
            animation: xbox-startup 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            /* Dá um brilho verde em volta do trevo */
            filter: drop-shadow(0 0 0px #4caf50); 
        }

        @keyframes xbox-startup {
            0% {
                opacity: 0;
                transform: scale(0.1);
                filter: drop-shadow(0 0 0px #4caf50);
            }
            50% {
                opacity: 1;
                transform: scale(1.1); /* Um pequeno salto (bounce) */
                filter: drop-shadow(0 0 40px #66ff66);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: drop-shadow(0 0 15px #4caf50);
            }
        }

        /* Anel de pulso estilo inicialização de console */
        .pulse-ring {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid #4caf50;
            opacity: 0;
            animation: pulse 3s ease-out forwards;
            animation-delay: 0.2s; /* Dispara logo quando a logo começa a crescer */
        }

        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            100% {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Animação suave para os textos surgirem depois da logo */
        .brand-name {
            margin-top: 25px;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            opacity: 0;
            animation: text-fade-in 2s ease-in-out 1.5s forwards;
        }

        .brand-subtitle {
            margin-top: 8px;
            font-size: 1rem;
            color: #a0d4a0;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            animation: text-fade-in 2s ease-in-out 2s forwards;
        }

        @keyframes text-fade-in {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Onda de impacto visual -->
    <div class="pulse-ring"></div>
    
    <!-- Container Principal -->
    <div class="splash-container">
        <!-- Logo do seu TCC referenciada diretamente -->
        <img src="faviconMarketPlace.png" alt="Logo MarketPlace Rural" class="logo">
        
        <div class="brand-name">MarketPlaceRural</div>
        <div class="brand-subtitle">Inovação no Campo</div>
    </div>

    <script>
        // Opcional: Lógica para redirecionar para a tela inicial do App após a animação

            window.location.href = 'home.html'; 
        }, 4500); // Aguarda 4.5 segundos antes de trocar de tela
        */
    </script>

</body>
</html>
