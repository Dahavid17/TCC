<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crie sua conta no MarketPlace Rural como produtor ou comprador e comece a negociar diretamente.">
  <title>Cadastro — MarketPlace Rural</title>
  <link rel="icon" type="image/png" href="img/favicon-32x32.png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="cadastro.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
  <main class="cadastro-wrapper">
    <section class="cadastro-box">
      <div class="cadastro-header">
        <a href="marketplace.html" class="logo">
          <i class="bi bi-flower1"></i>
          <span>MarketPlace Rural</span>
        </a>

        <h1>Criar conta</h1>
        <p>Cadastre-se como produtor ou comprador.</p>
      </div>

      <div class="cadastro-form">
        <!-- CORRIGIDO: onclick inline removido → addEventListener no cadastro.js -->
        <div class="tipo-conta">
          <button type="button" class="tipo-btn ativo">
            <i class="bi bi-person-badge"></i>
            Produtor
          </button>

          <button type="button" class="tipo-btn">
            <i class="bi bi-shop"></i>
            Comprador
          </button>
        </div>

        <input type="hidden" id="tipoConta" value="Produtor">

        <div class="form-group">
          <label for="nome">Nome completo</label>
          <div class="input-box">
            <i class="bi bi-person"></i>
            <input type="text" id="nome" placeholder="Digite seu nome completo" autocomplete="name">
          </div>
          <p id="mensagemNome" role="alert"></p>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <div class="input-box">
            <i class="bi bi-envelope"></i>
            <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
          </div>
          <p id="mensagemEmail" role="alert"></p>
        </div>

        <div class="form-group">
          <label for="telefone">Telefone</label>
          <div class="input-box">
            <i class="bi bi-telephone"></i>
            <input type="tel" id="telefone" placeholder="(00) 00000-0000" maxlength="15" autocomplete="tel">
          </div>
          <p id="mensagemTelefone" role="alert"></p>
        </div>

        <div class="form-group">
          <label for="endereco">Endereço</label>
          <div class="input-box">
            <i class="bi bi-geo-alt"></i>
            <input type="text" id="endereco" placeholder="Digite seu endereço" autocomplete="street-address">
          </div>
          <p id="mensagemEndereco" role="alert"></p>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="input-box">
            <i class="bi bi-lock"></i>
            <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="new-password">
            <button type="button" class="show-pass" id="botaoSenha" aria-label="Mostrar senha">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <p id="mensagemSenha" role="alert"></p>
        </div>

        <div class="form-group">
          <label for="confirmarSenha">Confirmar senha</label>
          <div class="input-box">
            <i class="bi bi-shield-lock"></i>
            <input type="password" id="confirmarSenha" placeholder="Confirme sua senha" autocomplete="new-password">
            <button type="button" class="show-pass" id="botaoConfirmar" aria-label="Mostrar confirmação de senha">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <p id="mensagemConfirmar" role="alert"></p>
        </div>

        <button type="button" id="cadastrar">
          Cadastrar
        </button>

        <p id="mensagemCadastrar" role="alert"></p>
      </div>

      <div class="links">
        <a href="login-marketplace.html">
          Já possui conta? Entrar
        </a>

        <a href="marketplace.html">
          <i class="bi bi-arrow-left"></i>
          Voltar para o projeto
        </a>
      </div>
    </section>
  </main>

  <button id="temaBtn" aria-label="Alternar tema claro/escuro">
    <i class="bi bi-moon-stars-fill"></i>
  </button>

  <script src="cadastro.js"></script>
</body>
</html>
