<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buzz Codex</title>
  <meta name="description" content="Buzz Codex — desenvolvimento web. Conheça o MarketPlace Rural, nosso TCC que conecta produtores rurais e compradores." />
  <link rel="canonical" href="https://buzzcodex.com.br/" />
  <!-- Nome do site nos resultados do Google ("site name") e prévia ao compartilhar o link -->
  <meta property="og:site_name" content="Buzz Codex" />
  <meta property="og:title" content="Buzz Codex" />
  <meta property="og:description" content="Buzz Codex — desenvolvimento web. Conheça o MarketPlace Rural, nosso TCC que conecta produtores rurais e compradores." />
  <meta property="og:url" content="https://buzzcodex.com.br/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://buzzcodex.com.br/assets/img/favicon/buzzcodex-192.png" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Buzz Codex",
    "alternateName": ["BuzzCodex", "buzzcodex.com.br"],
    "url": "https://buzzcodex.com.br/"
  }
  </script>
  <!-- Ícones: o Google exige no mínimo 48x48 (múltiplos de 48); /favicon.ico é o reserva dos navegadores. -->
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="48x48" href="assets/img/favicon/buzzcodex-48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="assets/img/favicon/buzzcodex-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon/buzzcodex-192.png" />
  <link rel="apple-touch-icon" href="assets/img/favicon/apple-touch-icon.png" />
  <meta name="theme-color" content="#09090d" />

  <!-- Mesmas fontes da home; a página seguinte já carrega do cache -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@800;900&family=Inter:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" />
  <link rel="prefetch" href="frontend/pages/home.html" />
  <link rel="preload" as="image" href="assets/img/logo/2-leve.png" />

  <style>
    :root {
      --bg: #09090d;
      --roxo: #a304d3;
      --roxo-neon: #c000ff;
      --verde: #34d304;
      --texto: #ffffff;
      --texto-suave: #bdbdbd;
      --logo: clamp(120px, 24vmin, 230px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      color: var(--texto);
      font-family: 'Inter', Arial, sans-serif;
    }

    /* Favo de mel animado no fundo */
    #favo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Vinheta: escurece as bordas e mantém o foco no centro */
    .vinheta {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(9, 9, 13, 0) 30%, rgba(9, 9, 13, 0.85) 100%);
    }

    .palco {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 3vmin, 28px);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(.6, 0, .4, 1), filter 0.8s ease;
    }

    .palco.saindo {
      opacity: 0;
      transform: scale(1.06);
      filter: blur(6px);
    }

    /* A imagem da logo tem muita margem transparente: a caixa recorta só o hexágono */
    .logo {
      position: relative;
      width: var(--logo);
      height: var(--logo);
      opacity: 0;
      transform: scale(0.55) rotate(-30deg);
      filter: blur(14px);
    }

    .logo img {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--logo) * 2.75);
      transform: translate(-50.8%, -46.8%);
      filter: drop-shadow(0 0 18px rgba(192, 0, 255, 0.55)) drop-shadow(0 0 32px rgba(52, 211, 4, 0.25));
      user-select: none;
      -webkit-user-drag: none;
    }

    .logo.entrou {
      animation: logoEntra 1.1s cubic-bezier(.2, .9, .25, 1.15) forwards, logoPulsa 2.4s ease-in-out 1.1s infinite;
    }

    @keyframes logoEntra {
      to { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); }
    }

    @keyframes logoPulsa {
      0%, 100% { opacity: 1; transform: scale(1); filter: brightness(1); }
      50% { opacity: 1; transform: scale(1.025); filter: brightness(1.15); }
    }

    .marca {
      font-family: 'Exo 2', Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(34px, 7.2vmin, 76px);
      letter-spacing: 0.06em;
      line-height: 1;
      white-space: nowrap;
      min-height: 1em;
    }

    .marca .buzz { color: var(--texto); text-shadow: 0 0 26px rgba(192, 0, 255, 0.75); }
    .marca .codex { color: var(--verde); text-shadow: 0 0 22px rgba(52, 211, 4, 0.55); }
    .marca .sorteio { opacity: 0.55; }

    .sub {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: clamp(11px, 1.7vmin, 15px);
      letter-spacing: 0.32em;
      color: var(--texto-suave);
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.7s ease;
    }

    .sub.entrou { opacity: 1; }

    .sub::before,
    .sub::after {
      content: '';
      height: 1px;
      width: 0;
      transition: width 0.9s cubic-bezier(.2, .8, .2, 1);
    }

    .sub::before { background: linear-gradient(90deg, transparent, var(--roxo-neon)); }
    .sub::after { background: linear-gradient(90deg, var(--verde), transparent); }
    .sub.entrou::before, .sub.entrou::after { width: clamp(30px, 8vmin, 80px); }

    /* Barra de progresso da intro */
    .progresso {
      position: fixed;
      left: 0;
      bottom: 0;
      height: 2px;
      width: 100%;
      transform-origin: left;
      transform: scaleX(0);
      background: linear-gradient(90deg, var(--roxo-neon), var(--verde));
      box-shadow: 0 0 12px rgba(192, 0, 255, 0.6);
    }

    #skip {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(10, 10, 14, 0.72);
      border: 1px solid rgba(163, 4, 211, 0.35);
      color: var(--texto);
      padding: 10px 20px;
      border-radius: 999px;
      font-family: 'Inter', Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 0 20px rgba(163, 4, 211, 0.15);
      transition: 0.3s ease;
    }

    #skip kbd {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--texto-suave);
    }

    #skip:hover,
    #skip:focus-visible {
      outline: none;
      background: rgba(52, 211, 4, 0.12);
      border-color: var(--verde);
      color: var(--verde);
      box-shadow: 0 0 25px rgba(52, 211, 4, 0.35);
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      #skip { bottom: 20px; right: 50%; transform: translateX(50%); }
      #skip:hover, #skip:focus-visible { transform: translateX(50%) translateY(-2px); }
      #skip kbd { display: none; }
      .sub { letter-spacing: 0.22em; gap: 10px; }
      .sub.entrou::before, .sub.entrou::after { width: 24px; }
    }

    /* Quem pediu menos movimento vê a marca parada e segue em seguida */
    @media (prefers-reduced-motion: reduce) {
      .logo, .logo.entrou { animation: none; opacity: 1; transform: none; filter: none; }
      .sub { opacity: 1; transition: none; }
      .sub::before, .sub::after { width: clamp(30px, 8vmin, 80px); transition: none; }
      .palco, .palco.saindo { transition: opacity 0.4s ease; transform: none; filter: none; }
    }
  </style>
</head>

<body>
  <canvas id="favo" aria-hidden="true"></canvas>
  <div class="vinheta" aria-hidden="true"></div>

  <main class="palco" id="palco">
    <div class="logo" id="logo">
      <img src="assets/img/logo/2-leve.png" alt="" />
    </div>
    <h1 class="marca" id="marca" aria-label="Buzz Codex"></h1>
    <p class="sub" id="sub">Desenvolvimento web</p>
  </main>

  <div class="progresso" id="progresso" aria-hidden="true"></div>
  <a href="frontend/pages/home.html" id="skip">Pular intro <span aria-hidden="true">→</span> <kbd aria-hidden="true">Esc</kbd></a>

  <noscript>
    <style>.logo, .sub { opacity: 1 !important; transform: none !important; filter: none !important; } .marca::after { content: 'BUZZ CODEX'; }</style>
  </noscript>

  <script>
    (function () {
      const DESTINO = 'frontend/pages/home.html';
      const reduzido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // ── LINHA DO TEMPO (segundos) ─────────────────────────
      const T = reduzido
        ? { logo: 0, texto: 0, sub: 0, saida: 1.6, fim: 2.0 }
        : { logo: 0.7, texto: 1.5, sub: 2.5, saida: 4.8, fim: 5.6 };

      const canvas = document.getElementById('favo');
      const ctx = canvas.getContext('2d');
      const palco = document.getElementById('palco');
      const logo = document.getElementById('logo');
      const marca = document.getElementById('marca');
      const sub = document.getElementById('sub');
      const barra = document.getElementById('progresso');

      let W = 0, H = 0, celulas = [], R = 36, distMax = 1;

      // ── FAVO DE MEL ───────────────────────────────────────
      // Hexágonos "pontudos" (vértice em cima), iguais aos da logo.
      function montarFavo() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        R = Math.max(26, Math.min(46, Math.min(W, H) / 16));
        const largura = Math.sqrt(3) * R;
        const passoY = 1.5 * R;
        const cx = W / 2, cy = H / 2;
        const colunas = Math.ceil(W / largura) + 2;
        const linhas = Math.ceil(H / passoY) + 2;

        celulas = [];
        distMax = Math.hypot(W / 2, H / 2);
        for (let l = -1; l < linhas; l++) {
          for (let c = -1; c < colunas; c++) {
            // Alinha o hexágono central exatamente atrás da logo
            const x = cx + (c - Math.floor(colunas / 2)) * largura + ((l - Math.floor(linhas / 2)) & 1 ? largura / 2 : 0);
            const y = cy + (l - Math.floor(linhas / 2)) * passoY;
            const d = Math.hypot(x - cx, y - cy) / distMax;
            celulas.push({
              x, y, d,
              // Roxo à esquerda/em cima, verde embaixo à direita, como o degradê da logo
              mistura: Math.max(0, Math.min(1, ((x - cx) / W + (y - cy) / H) * 1.1 + 0.5)),
              fase: Math.random() * Math.PI * 2,
              brilho: Math.random()
            });
          }
        }
      }

      function hexagono(x, y, r) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = Math.PI / 3 * i - Math.PI / 2;
          const px = x + r * Math.cos(a), py = y + r * Math.sin(a);
          i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.closePath();
      }

      // roxo-neon (192,0,255) → verde (52,211,4)
      function cor(m, a) {
        const r = Math.round(192 + (52 - 192) * m);
        const g = Math.round(0 + (211 - 0) * m);
        const b = Math.round(255 + (4 - 255) * m);
        return `rgba(${r},${g},${b},${a})`;
      }

      function desenharFavo(t) {
        ctx.clearRect(0, 0, W, H);

        // Brilho central que acompanha a entrada da logo
        const g = Math.min(1, Math.max(0, (t - 0.4) / 1.2));
        if (g > 0) {
          const rad = Math.min(W, H) * 0.55;
          const gr = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, rad);
          gr.addColorStop(0, `rgba(120, 10, 180, ${0.22 * g})`);
          gr.addColorStop(0.6, `rgba(52, 211, 4, ${0.035 * g})`);
          gr.addColorStop(1, 'rgba(9, 9, 13, 0)');
          ctx.fillStyle = gr;
          ctx.fillRect(0, 0, W, H);
        }

        // Onda que sai do centro e "acende" o favo
        const frente = reduzido ? 2 : (t - 0.15) * 0.75;
        const r = R * 0.9;
        ctx.lineJoin = 'round';

        for (const c of celulas) {
          const atraso = frente - c.d;
          if (atraso < 0) continue;

          const pico = Math.exp(-(atraso * atraso) / 0.004);          // crista da onda
          const resto = Math.min(1, atraso * 6) * (0.11 + 0.12 * (1 - c.d)); // brilho que fica
          const pisca = c.brilho > 0.93 ? (Math.sin(t * 2.2 + c.fase) * 0.5 + 0.5) * 0.35 : 0;
          const a = Math.min(1, pico * 0.9 + resto + pisca);
          if (a < 0.01) continue;

          hexagono(c.x, c.y, r);
          if (pico > 0.05 || pisca > 0.05) {
            ctx.fillStyle = cor(c.mistura, (pico * 0.16 + pisca * 0.25));
            ctx.fill();
          }
          ctx.lineWidth = 1 + pico * 1.5;
          ctx.strokeStyle = cor(c.mistura, a);
          ctx.stroke();
        }
      }

      // ── TEXTO QUE SE "DECODIFICA" ─────────────────────────
      const TEXTO = 'BUZZ CODEX';
      const SIMBOLOS = '01<>/{}[]#$%&*+=?ABCDEFXZ';
      const DURACAO_TEXTO = 1.0;

      function desenharMarca(t) {
        const p = (t - T.texto) / DURACAO_TEXTO;
        if (p < 0) return;
        let html = '';
        for (let i = 0; i < TEXTO.length; i++) {
          const ch = TEXTO[i];
          const classe = i < 4 ? 'buzz' : 'codex';
          if (ch === ' ') { html += ' '; continue; }
          const resolve = (i / TEXTO.length) * 0.75 + 0.2; // cada letra se fixa um pouco depois da anterior
          if (p >= resolve || reduzido) {
            html += `<span class="${classe}">${ch}</span>`;
          } else if (p >= resolve - 0.35) {
            const s = SIMBOLOS[(Math.random() * SIMBOLOS.length) | 0];
            html += `<span class="${classe} sorteio">${s}</span>`;
          } else {
            html += `<span class="${classe}" style="opacity:0">${ch}</span>`;
          }
        }
        marca.innerHTML = html;
      }

      // ── SAÍDA ─────────────────────────────────────────────
      let saiu = false;
      function sair(imediato) {
        if (saiu) return;
        saiu = true;
        palco.classList.add('saindo');
        canvas.style.transition = 'opacity 0.8s ease';
        canvas.style.opacity = '0';
        setTimeout(() => window.location.replace(DESTINO), imediato ? 250 : 800);
      }

      document.getElementById('skip').addEventListener('click', e => {
        e.preventDefault();
        sair(true);
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          sair(true);
        }
      });

      // ── LOOP ──────────────────────────────────────────────
      let t = 0, ultimo = null, textoPronto = false;
      function quadro(ts) {
        if (ultimo === null) ultimo = ts;
        t += Math.min((ts - ultimo) / 1000, 0.05);
        ultimo = ts;

        desenharFavo(t);
        if (t >= T.logo && !logo.classList.contains('entrou')) logo.classList.add('entrou');
        if (!textoPronto) {
          desenharMarca(t);
          if (t >= T.texto + DURACAO_TEXTO) textoPronto = true;
        }
        if (t >= T.sub && !sub.classList.contains('entrou')) sub.classList.add('entrou');
        barra.style.transform = `scaleX(${Math.min(1, t / T.saida)})`;
        if (t >= T.saida) sair(false);

        if (!saiu || t < T.fim) requestAnimationFrame(quadro);
      }

      montarFavo();
      window.addEventListener('resize', montarFavo);
      requestAnimationFrame(quadro);
    })();
  </script>
</body>

</html>
