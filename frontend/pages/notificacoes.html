<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="../js/painel.js?v=20261125"></script>
    <link rel="stylesheet" href="../css/notificacoes.css?v=1">
</head>

<body>

    <header class="topbar">
        <a href="inicio.html" class="logo"><i class="bi bi-flower1"></i><span>MarketPlace Rural</span></a>
        <div class="top-actions">
            <button type="button" class="icon-btn" id="btnNotificacoes" aria-label="Notificações"><i class="bi bi-bell"></i></button>
            <button type="button" class="icon-btn" id="btnMensagens" aria-label="Negociações"><i class="bi bi-chat-dots"></i></button>
            <div class="perfil">
                <button type="button" id="btnPerfil" aria-label="Abrir configurações da conta">
                    <div class="avatar" id="avatarUsuario">U</div>
                    <div><span id="nomeUsuario">Usuário</span><small id="tipoUsuario"></small></div>
                </button>
            </div>
        </div>
    </header>

    <aside class="sidebar">
        <nav>
            <a href="inicio.html"><i class="bi bi-house"></i><span>Início</span></a>
            <a href="meus-produtos.html"><i class="bi bi-box-seam"></i><span>Meus Produtos</span></a>
            <a href="pedidos.html"><i class="bi bi-cart-check"></i><span>Pedidos</span></a>
            <a href="negociacoes.html"><i class="bi bi-chat-left-text"></i><span>Negociações</span></a>
            <a href="estoque.html"><i class="bi bi-clipboard-data"></i><span>Estoque</span></a>
            <a href="favoritos.html"><i class="bi bi-heart"></i><span>Favoritos</span></a>
            <a href="configuracoes.html"><i class="bi bi-gear"></i><span>Configurações</span></a>
            <a href="../../backend/auth/logout.php"><i class="bi bi-box-arrow-right"></i><span>Sair</span></a>
        </nav>
    </aside>

    <main class="conteudo">
        <section class="page-header">
            <div>
                <h1>Notificações</h1>
                <p>Lembretes da agenda, vencimentos de documentos, alertas de preço, silos e avaliações.</p>
            </div>
            <button type="button" id="btnLerTodas"><i class="bi bi-check2-all"></i> Marcar todas como lidas</button>
        </section>
        <section class="mr-contexto">
            <div class="campo"><label for="nFiltro">Mostrar</label><select id="nFiltro"><option value="">Todas</option><option value="1">Só não lidas</option></select></div>
            <div class="mr-acoes" style="display:flex;align-items:end"><button type="button" class="btn-sec" id="btnPermitir"><i class="bi bi-bell"></i> Receber avisos neste aparelho</button></div>
        </section>
        <ul class="mr-lista" id="listaNotificacoes"></ul>
    </main>

    <button type="button" id="temaBtn" aria-label="Alternar tema"><i class="bi bi-moon-stars-fill"></i></button>

    <script src="../js/tema-transicao.js?v=20261125"></script>
    <script src="../js/menu.js?v=20261125"></script>
    <script src="../js/notificacoes.js?v=1"></script>
    <script src="../js/modulos.js?v=2"></script>
    <script>
    (() => {
        // Contrato do sino do servidor: listar.php -> { nao_lidas, notificacoes: [{ id, tipo, titulo,
        // mensagem, link, lida, segundos }] } (últimas 20); marcar.php recebe id=<n> ou todas=1.
        const ICONES = {
            pedido_novo: "bi-bag-check", pedido_status: "bi-truck", mensagem: "bi-chat-dots", proposta: "bi-cash-coin", sistema: "bi-info-circle",
            agenda: "bi-calendar-event", vencimento: "bi-hourglass-split", documento: "bi-file-earmark-text",
            alerta_preco: "bi-tag", silo: "bi-database", avaliacao: "bi-star"
        };
        const URGENTES = ["vencimento", "silo"];
        const $ = (s) => document.querySelector(s);
        const linkSeguro = (l) => /^[a-z0-9-]+\.html(\?[a-z0-9=&_-]*)?$/i.test(l || "") ? l : null;
        const ha = (s) => s < 60 ? "agora" : s < 3600 ? `há ${Math.floor(s / 60)} min` : s < 86400 ? `há ${Math.floor(s / 3600)} h` : `há ${Math.floor(s / 86400)} dia(s)`;

        async function carregar() {
            try {
                const d = await MR.api("notificacoes/listar.php");
                const lista = $("#nFiltro").value ? d.notificacoes.filter((n) => !n.lida) : d.notificacoes;
                $("#listaNotificacoes").innerHTML = lista.length ? lista.map((n) => {
                    const link = linkSeguro(n.link);
                    return `<li class="${n.lida ? "lida" : URGENTES.includes(n.tipo) ? "atrasado" : "aviso"}">
                        <i class="bi ${ICONES[n.tipo] || "bi-bell"}"></i>
                        <div><strong>${MR.esc(n.titulo)}</strong><small>${MR.esc(n.mensagem)} · ${ha(n.segundos)}</small></div>
                        <div class="mr-acoes">
                            ${link ? `<a class="btn-icone" href="${MR.esc(link)}" data-ler="${n.id}" aria-label="Abrir"><i class="bi bi-arrow-right"></i></a>` : ""}
                            ${n.lida ? "" : `<button type="button" class="btn-icone" data-ler="${n.id}" aria-label="Marcar como lida"><i class="bi bi-check2"></i></button>`}
                        </div>
                    </li>`;
                }).join("") : '<li><div class="mr-vazio"><i class="bi bi-bell-slash"></i>Nenhuma notificação.</div></li>';
            } catch (e) {
                MR.toast(e.message, "erro");
            }
        }

        document.addEventListener("click", async (e) => {
            const el = e.target.closest("#listaNotificacoes [data-ler]");
            if (!el) return;
            const link = el.tagName === "A" ? el.getAttribute("href") : null;
            if (link) e.preventDefault();
            await MR.api("notificacoes/marcar.php", { form: { id: el.dataset.ler } }).catch(() => null);
            if (link) location.href = link; else carregar();
        });

        $("#nFiltro").addEventListener("change", carregar);
        $("#btnLerTodas").addEventListener("click", async () => { await MR.api("notificacoes/marcar.php", { form: { todas: "1" } }); carregar(); });
        const permitir = $("#btnPermitir");
        if (!("Notification" in window) || Notification.permission !== "default") permitir.classList.add("hidden");
        permitir.addEventListener("click", async () => { if ((await Notification.requestPermission()) === "granted") { permitir.classList.add("hidden"); MR.toast("Avisos ativados neste aparelho."); } });
        carregar();
    })();
    </script>
</body>

</html>
