<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Nova senha | MarketPlace Rural</title>
    <link rel="icon" type="image/png" href="../../assets/img/favicon/faviconMarketPlace.png">
    <link rel="stylesheet" href="../css/tokens.css?v=20261125">
    <link rel="stylesheet" href="../css/painel.css?v=20261125">
    <link rel="stylesheet" href="../css/modulos.css?v=2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="../js/painel.js?v=20261125"></script>
</head>

<body>
    <main class="mr-auth">
        <section class="mr-auth-card">
            <a href="login-marketplace.html" class="logo"><i class="bi bi-flower1"></i><span>MarketPlace Rural</span></a>
            <h1>Criar nova senha</h1>
            <p>Use pelo menos 6 caracteres.</p>
            <form id="formNovaSenha" novalidate>
                <div class="campo">
                    <label for="senha">Nova senha</label>
                    <input id="senha" name="senha" type="password" required minlength="6" autocomplete="new-password">
                </div>
                <div class="campo">
                    <label for="confirmar">Repita a nova senha</label>
                    <input id="confirmar" name="confirmar" type="password" required minlength="6" autocomplete="new-password">
                </div>
                <div class="mr-msg hidden" id="mensagem" role="status"></div>
                <button type="submit" class="btn-principal"><i class="bi bi-shield-lock"></i> Salvar nova senha</button>
            </form>
            <a class="mr-voltar" href="login-marketplace.html"><i class="bi bi-arrow-left"></i> Voltar para o login</a>
        </section>
    </main>

    <script>
    (() => {
        try { if (localStorage.getItem("marketplace:tema") === "dark") document.body.classList.add("dark"); } catch (e) { /* ignora */ }
        const form = document.getElementById("formNovaSenha");
        const msg = document.getElementById("mensagem");
        const token = new URLSearchParams(location.search).get("token") || "";
        // O token sai da barra de endereço (não fica no histórico nem em capturas de tela).
        history.replaceState(null, "", location.pathname);
        const mostrar = (texto, tipo) => { msg.textContent = texto; msg.className = "mr-msg " + tipo; };
        const bloquear = () => form.querySelectorAll("input, button").forEach((el) => { el.disabled = true; });

        fetch("../../backend/auth/redefinir_senha.php?token=" + encodeURIComponent(token))
            .then((r) => r.json())
            .then((d) => { if (!d.sucesso) { mostrar(d.mensagem, "erro"); bloquear(); } })
            .catch(() => mostrar("Não foi possível conferir o link.", "erro"));

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (form.senha.value.length < 6) return mostrar("A senha precisa ter pelo menos 6 caracteres.", "erro");
            if (form.senha.value !== form.confirmar.value) return mostrar("As senhas não conferem.", "erro");
            const dados = new FormData(form);
            dados.set("token", token);
            try {
                const r = await fetch("../../backend/auth/redefinir_senha.php", { method: "POST", body: dados });
                const d = await r.json();
                mostrar(d.mensagem, d.sucesso ? "ok" : "erro");
                if (d.sucesso) { bloquear(); setTimeout(() => { location.href = "login-marketplace.html"; }, 2500); }
            } catch (erro) {
                mostrar("Não foi possível conectar. Tente novamente.", "erro");
            }
        });
    })();
    </script>
  <script src="../js/aviso-cookies.js?v=1"></script>
</body>

</html>
