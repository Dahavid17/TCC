<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de compras e vendas | MarketPlace Rural</title>
    <link rel="icon" type="image/png" href="../../assets/img/favicon/faviconMarketPlace.png">
    <link rel="stylesheet" href="../css/tokens.css?v=20261125">
    <link rel="stylesheet" href="../css/painel.css?v=20261125">
    <link rel="stylesheet" href="../css/modulos.css?v=2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="../js/painel.js?v=20261125"></script>
    <link rel="stylesheet" href="../css/notificacoes.css?v=1">
</head>

<body>

    <header class="topbar">
        <a href="inicio.html" class="logo"><i class="bi bi-flower1"></i><span>MarketPlace Rural</span></a>
        <div class="top-actions">
            <button type="button" class="icon-btn" id="btnNotificacoes" aria-label="Notificações"><i class="bi bi-bell"></i></button>
            <button type="button" class="icon-btn" id="btnMensagens" aria-label="Negociações"><i class="bi bi-chat-dots"></i></button>
            <div class="perfil">
                <button type="button" id="btnPerfil" aria-label="Abrir configurações da conta">
                    <div class="avatar" id="avatarUsuario">U</div>
                    <div><span id="nomeUsuario">Usuário</span><small id="tipoUsuario"></small></div>
                </button>
            </div>
        </div>
    </header>

    <aside class="sidebar">
        <nav>
            <a href="inicio.html"><i class="bi bi-house"></i><span>Início</span></a>
            <a href="meus-produtos.html"><i class="bi bi-box-seam"></i><span>Meus Produtos</span></a>
            <a href="pedidos.html"><i class="bi bi-cart-check"></i><span>Pedidos</span></a>
            <a href="negociacoes.html"><i class="bi bi-chat-left-text"></i><span>Negociações</span></a>
            <a href="estoque.html"><i class="bi bi-clipboard-data"></i><span>Estoque</span></a>
            <a href="favoritos.html"><i class="bi bi-heart"></i><span>Favoritos</span></a>
            <a href="configuracoes.html"><i class="bi bi-gear"></i><span>Configurações</span></a>
            <a href="../../backend/auth/logout.php"><i class="bi bi-box-arrow-right"></i><span>Sair</span></a>
        </nav>
    </aside>

    <main class="conteudo">

        <section class="page-header">
            <div>
                <h1>Histórico de compras e vendas</h1>
                <p>Todos os seus pedidos, com totais por mês, avaliações e exportação.</p>
            </div>
            <button type="button" id="btnReputacao"><i class="bi bi-star"></i> Minha reputação</button>
        </section>

        <div class="mr-kpis" id="resumoHistorico"></div>

        <div class="mr-card">
            <h3><i class="bi bi-bar-chart"></i> Compras e vendas por mês</h3>
            <div class="mr-grafico baixo"><canvas id="graficoHistorico"></canvas></div>
        </div>

        <div class="mr-contexto">
            <div class="campo"><label for="hPapel">Mostrar</label><select id="hPapel"><option value="">Compras e vendas</option><option value="compras">Só compras</option><option value="vendas">Só vendas</option></select></div>
            <div class="campo"><label for="hStatus">Situação</label><select id="hStatus"><option value="">Todas</option><option value="recebido">Recebido</option><option value="negociacao">Em negociação</option><option value="preparo">Em preparo</option><option value="entregue">Entregue</option><option value="cancelado">Cancelado</option></select></div>
            <div class="campo"><label for="hDe">De</label><input type="date" id="hDe"></div>
            <div class="campo"><label for="hAte">Até</label><input type="date" id="hAte"></div>
            <div class="mr-acoes" style="display:flex;gap:8px;align-items:end">
                <button type="button" class="btn-sec" data-exportar="pdf"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
                <button type="button" class="btn-sec" data-exportar="xlsx"><i class="bi bi-file-earmark-excel"></i> Excel</button>
            </div>
        </div>

        <div class="mr-card mr-tabela">
            <table>
                <thead><tr><th>Pedido</th><th>Data</th><th>Tipo</th><th>Com</th><th>Itens</th><th class="num">Total</th><th>Situação</th><th>Avaliação</th></tr></thead>
                <tbody id="tabelaHistorico"></tbody>
            </table>
        </div>

    </main>

    <div class="modal" id="modalAvaliar">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="avaliarTitulo" style="width:min(460px,100%)">
            <div class="modal-header"><h2 id="avaliarTitulo">Avaliar</h2><button type="button" data-fechar="modalAvaliar" aria-label="Fechar"><i class="bi bi-x-lg"></i></button></div>
            <form id="formAvaliar">
                <input type="hidden" name="pedido_id">
                <input type="hidden" name="nota">
                <p class="mr-ajuda" id="avaliarInfo"></p>
                <div class="mr-nota" role="radiogroup" aria-label="Nota de 1 a 5 estrelas" id="seletorNota">
                    <button type="button" data-nota="1" aria-label="1 estrela">★</button><button type="button" data-nota="2" aria-label="2 estrelas">★</button><button type="button" data-nota="3" aria-label="3 estrelas">★</button><button type="button" data-nota="4" aria-label="4 estrelas">★</button><button type="button" data-nota="5" aria-label="5 estrelas">★</button>
                </div>
                <div class="campo"><label for="avaliarComentario">Comentário (opcional)</label><textarea id="avaliarComentario" name="comentario" maxlength="500" rows="3" placeholder="Como foi a negociação, a entrega, a qualidade?"></textarea></div>
                <div class="modal-actions"><button type="button" data-fechar="modalAvaliar">Cancelar</button><button type="submit">Enviar avaliação</button></div>
            </form>
        </div>
    </div>

    <div class="modal" id="modalReputacao">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="reputacaoTitulo" style="width:min(560px,100%)">
            <div class="modal-header"><h2 id="reputacaoTitulo">Minha reputação</h2><button type="button" data-fechar="modalReputacao" aria-label="Fechar"><i class="bi bi-x-lg"></i></button></div>
            <div id="conteudoReputacao"></div>
        </div>
    </div>

    <button type="button" id="temaBtn" aria-label="Alternar tema"><i class="bi bi-moon-stars-fill"></i></button>

    <script src="../js/tema-transicao.js?v=20261125"></script>
    <script src="../js/menu.js?v=20261125"></script>
    <script src="../js/notificacoes.js?v=1"></script>
    <script src="../js/modulos.js?v=2"></script>
    <script src="../js/exportar.js?v=1"></script>
    <script src="../js/historico.js?v=1"></script>
</body>

</html>
