<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Todos os produtos do MarketPlace Rural: frutas, hortaliças, grãos, laticínios, carnes e flores direto do produtor.">
    <title>Produtos | MarketPlace Rural</title>

    <link rel="icon" type="image/png" href="../../assets/img/favicon/faviconMarketPlace.png">
    <link rel="stylesheet" href="../css/tokens.css?v=20261125">
    <link rel="stylesheet" href="../css/painel.css?v=20261125">
    <link rel="stylesheet" href="../css/dashboard.css?v=20261125">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="../js/painel.js?v=20261125"></script>
    <link rel="stylesheet" href="../css/notificacoes.css?v=1">
    <link rel="stylesheet" href="../css/aviso-proprio-produto.css?v=1">
</head>
<body>

    <!-- HEADER -->
    <header class="topbar">
        <a href="inicio.html" class="logo">
            <i class="bi bi-flower1"></i>
            <span>MarketPlace Rural</span>
        </a>

        <form class="search-form" id="formPesquisa">
            <div class="search-box">
                <i class="bi bi-search"></i>
                <input type="search" id="pesquisa" name="pesquisa" placeholder="Pesquisar produtos..." autocomplete="off">
            </div>
        </form>

        <div class="top-actions">
            <button type="button" class="icon-btn" id="btnNotificacoes" aria-label="Notificações">
                <i class="bi bi-bell" aria-hidden="true"></i>
            </button>
            <button type="button" class="icon-btn" id="btnMensagens" aria-label="Mensagens das negociações">
                <i class="bi bi-chat-dots" aria-hidden="true"></i>
            </button>

            <div class="perfil">
                <button type="button" id="btnPerfil">
                    <div class="avatar" id="avatarUsuario">U</div>
                    <div>
                        <span id="nomeUsuario">Carregando...</span>
                        <small id="tipoUsuario">Produtor</small>
                    </div>
                </button>
            </div>
        </div>
    </header>

    <!-- MENU LATERAL -->
    <aside class="sidebar">
        <nav>
            <a href="inicio.html">
                <i class="bi bi-house"></i>
                <span>Inicio</span>
            </a>
            <a href="produtos.html" class="ativo">
                <i class="bi bi-shop"></i>
                <span>Produtos</span>
            </a>
            <a href="meus-produtos.html">
                <i class="bi bi-box-seam"></i>
                <span>Meus Produtos</span>
            </a>
            <a href="pedidos.html">
                <i class="bi bi-cart-check"></i>
                <span>Pedidos</span>
            </a>
            <a href="negociacoes.html">
                <i class="bi bi-chat-left-text"></i>
                <span>Negociações</span>
            </a>
            <a href="estoque.html">
                <i class="bi bi-clipboard-data"></i>
                <span>Estoque</span>
            </a>
            <a href="favoritos.html">
                <i class="bi bi-heart"></i>
                <span>Favoritos</span>
            </a>
            <a href="configuracoes.html">
                <i class="bi bi-gear"></i>
                <span>Configurações</span>
            </a>
            <a href="../../backend/auth/logout.php">
                <i class="bi bi-box-arrow-right"></i>
                <span>Sair</span>
            </a>
        </nav>
    </aside>

    <!-- CONTEÚDO -->
    <main class="conteudo">

        <section class="page-header">
            <div>
            <h1>Produtos</h1>
            <p>Todos os produtos à venda no MarketPlace Rural. Escolha uma categoria ou pesquise pelo nome.</p>
            </div>
        </section>

        <!-- FILTROS -->
        <section class="filtros-produtos categorias">
            <div class="lista-categorias" id="filtrosProdutos">
                <button type="button" data-categoria="" class="ativa"><i class="bi bi-grid"></i> Todos</button>
                <button type="button" data-categoria="promocao" class="filtro-promocao"><i class="bi bi-tag-fill"></i> Promoções</button>
                <button type="button" data-categoria="hortalicas"><i class="bi bi-flower2"></i> Hortaliças</button>
                <button type="button" data-categoria="frutas"><i class="bi bi-apple"></i> Frutas</button>
                <button type="button" data-categoria="graos"><i class="bi bi-basket"></i> Grãos</button>
                <button type="button" data-categoria="laticinios"><i class="bi bi-cup-straw"></i> Laticínios</button>
                <button type="button" data-categoria="carnes"><i class="bi bi-egg-fried"></i> Carnes</button>
                <button type="button" data-categoria="flores"><i class="bi bi-flower1"></i> Flores</button>
            </div>
        </section>

        <!-- LISTA -->
        <section class="produtos-todos">
            <p class="contagem-produtos" id="contagemProdutos" aria-live="polite">Carregando produtos...</p>
            <div class="grid-produtos" id="listaProdutos">
                <!-- Os produtos são inseridos pelo catalogo.js a partir do banco -->
            </div>
        </section>

    </main>

    <!-- MODAL DE COMPRA (usado pelo vitrine.js) -->
    <!-- ============ MODAL: FAZER PEDIDO (vitrine.js) ============ -->
    <div class="modal" id="modalCompra" aria-hidden="true">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="compraNome">
            <div class="modal-header">
                <h2 id="compraNome">Produto</h2>
                <button type="button" id="compraFechar" aria-label="Fechar">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
            </div>
            <p class="compra-info" id="compraInfo"></p>
            <div class="campo">
                <label for="compraQuantidade">Quantidade</label>
                <input type="number" id="compraQuantidade" min="1" value="1">
            </div>
            <p class="compra-total">Total: <strong id="compraTotal">R$ 0,00</strong></p>
            <div class="modal-actions">
                <button type="button" id="compraCancelar">Cancelar</button>
                <button type="button" id="compraConfirmar">Fazer pedido</button>
            </div>
        </div>
    </div>

    <button id="temaBtn" type="button" aria-label="Alternar tema">
        <i class="bi bi-moon-stars-fill"></i>
    </button>

    <script src="../js/tema-transicao.js?v=20261125"></script>
    <script src="../js/menu.js?v=20261125"></script>
    <script src="../js/notificacoes.js?v=1"></script>
    <script src="../js/aviso-proprio-produto.js?v=1"></script>
    <script src="../js/vitrine.js?v=20261125"></script>
    <script src="../js/catalogo.js?v=2"></script>
</body>
</html>
